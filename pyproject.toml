[build-system]
# setuptools 77 is the floor for PEP 639: earlier versions ignore
# `license-files` and reject the SPDX string form of `license`.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-mobile-api"
version = "1.0.0"
description = "Python client for documented KORAIL mobile app APIs: read-only by default, with a consent-gated mutation surface"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX form. Do NOT add a `License ::` classifier alongside it: the two
# are mutually exclusive, and the legacy `license = {text = ...}` table is
# already deprecated (setuptools warns, and errors from 2027-02-18).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "yakisoba0728", email = "yakihyuk0728@gmail.com" }]
keywords = ["korail", "read-only-by-default", "mobile-api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
]

[project.urls]
Homepage = "https://github.com/yakisoba0728/korail-mobile-api"
Repository = "https://github.com/yakisoba0728/korail-mobile-api"
Issues = "https://github.com/yakisoba0728/korail-mobile-api/issues"
Changelog = "https://github.com/yakisoba0728/korail-mobile-api/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
korail_mobile_api = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# Test the tree pytest was invoked in, not whatever `korail_mobile_api` the
# editable install happens to resolve to. Without this, running pytest from a
# git worktree imports the MAIN checkout's src/ and reports a green suite for
# code that was never under test.
pythonpath = ["src"]
markers = [
  "live: tests that call live KORAIL services and require explicit opt-in",
]
