[build-system]
# setuptools 77 is the floor for PEP 639: earlier versions ignore
# `license-files` and reject the SPDX string form of `license`.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-mobile-api"
version = "1.2.0"
description = "Python client for documented KORAIL mobile app APIs: read-only by default, with an allowlisted mutation surface"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX form. Do NOT add a `License ::` classifier alongside it: the two
# are mutually exclusive, and the legacy `license = {text = ...}` table is
# already deprecated (setuptools warns, and errors from 2027-02-18).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "yakisoba0728", email = "yakihyuk0728@gmail.com" }]
keywords = ["korail", "read-only-by-default", "mobile-api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
]

[project.urls]
Homepage = "https://github.com/yakisoba0728/korail-mobile-api"
Repository = "https://github.com/yakisoba0728/korail-mobile-api"
Issues = "https://github.com/yakisoba0728/korail-mobile-api/issues"
Changelog = "https://github.com/yakisoba0728/korail-mobile-api/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# CI 도구용, 런타임 의존성이 아니다. pyright 는 strict 오류 0 을 확인한 버전으로
# 고정했으니, 올릴 때는 게이트를 다시 돌려 확인한다.
dev = [
  "build>=1,<2",
  "mkdocs>=1.6,<2",
  "pyright==1.1.411",
  "ruff>=0.16,<0.17",
]
# 불변식 검사용, 런타임 의존성이 아니다. ebc4d5f 가 지운 "test" extras 와 같은
# 자리지만 담는 것이 다르다 — 그때는 121파일 1,072개 테스트였고, 지금은 손으로
# 유지하는 표와 목록이 서로 어긋나지 않는지 보는 한 파일이다.
test = [
  "pytest>=8,<10",
]
# 문서 사이트 빌드용, 런타임 의존성이 아니다. 상한은 mkdocs-material 의 MkDocs 2.0
# 플러그인-체계 폐지 예고와, mkdocstrings-python 2.x/griffe 2.x 가 이 저장소에서
# 실제로 검증한 첫 조합이라는 데서 온다.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocs-include-markdown-plugin>=6.2,<8",
  "mkdocstrings[python]>=0.26,<1",
  "mkdocstrings-python>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
korail_mobile_api = ["py.typed"]

[tool.ruff]
# `ruff format` 은 채택하지 않았다 — 손으로 열을 맞춘 APK-인용 표와 주석 블록을
# 재배치해 버리기 때문이다. 게이트는 `ruff check` 뿐이다.
#
# line-length 100 은 취향이 아니라 실측이다(근거는 git 이력 참고).
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  # 모호한 유니코드 문자. 이 저장소에서만 142건이 걸리는데 전부 의도된 문자다:
  # 산문의 en dash `–`, 좌석 격자의 `×`, 그리고 유니코드 정규화 방어를 시험하려고
  # 일부러 넣어 둔 아라비아-인도 숫자 픽스처. ASCII 로 "고치면" 시험 대상 자체가
  # 사라진다.
  "RUF001",
  "RUF002",
  "RUF003",
  # `__all__` 알파벳 정렬. 지금 `__all__` 는 __init__.py 의 import 블록과 같은
  # 모듈 순서로 묶여 있다. 묶음을 지키는 이유는 이름 하나를 끌어내릴 때 import 줄과
  # __all__ 항목을 둘 다 지웠는지 눈으로 대조할 수 있게 하기 위해서다. 알파벳순은
  # 그 대조를 없앤다. 그 대조를 대신해 주던 export 테스트는 이제 없다.
  "RUF022",
]

[tool.ruff.lint.isort]
# 이 저장소는 import 블록 뒤에 빈 줄 2개를 쓴다. ruff 의 기본값(-1, "알아서")은
# 뒤따르는 것이 def/class 가 아니면 1줄로 줄여 버려서, I001 자동수정이 순서와는
# 무관한 공백 변경을 저장소 전체에 흩뿌린다. 기존 관례를 그대로 못박는다.
lines-after-imports = 2

[tool.ruff.lint.flake8-bugbear]
# B008 은 "기본값에서 함수를 부르지 마라"는 규칙이고, 그 이유는 그 값이 모든 호출에
# 공유되는 가변 객체가 되기 때문이다. RefundCompanion 은 `@dataclass(frozen=True)`
# 라서 그 위험이 성립하지 않는다. 기본값을 모듈 상수로 빼면 "동반자 없음"이라는
# 뜻이 시그니처에서 사라지므로, 규칙을 끄는 대신 이 호출만 불변으로 선언한다.
extend-immutable-calls = ["korail_mobile_api.read_payloads.RefundCompanion"]

[tool.ruff.lint.per-file-ignores]
# 마스킹 대상 키 집합은 같은 철자를 일부러 여러 번 적는다. 중복 하나하나가 서로
# 다른 주석 아래 놓여 있고, 그 주석이 "이 철자는 어느 라우트/어느 응답에서
# 오는가"를 말한다(예: ogtkRetPwd 는 요청 키로도, 인덱스 붙은 @FieldMap 키로도,
# OrgTk 응답 필드로도 온다). B033 의 자동수정은 중복만 지우고 주석은 남겨서,
# 근거가 딸린 대상 없이 떠 있게 만든다.
"src/korail_mobile_api/redaction.py" = ["B033"]

[tool.pytest.ini_options]
# 이 스위트는 네트워크를 타지 않고 픽스처도 없다 -- 전부 introspection 이다.
# 라이브 검증은 scripts/ 가 KORAIL_MOBILE_API_LIVE=1 뒤에서 따로 한다.
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.pyright]
# VSCode/Pylance 가 그대로 읽는 설정이다. 기준은 하나 — 이 저장소의 파일을 열었을
# 때 빨간 줄이 없어야 한다. 그래서 아래 값은 고른 것이 아니라 실제로 돌려서 오류
# 0 이 되는 조합을 찾은 결과다.
include = ["src", "scripts"]
# src 레이아웃을 명시한다. pyright 는 ./src 를 알아서 찾아 주기도 하지만, 그건
# 문서화된 계약이 아니라 휴리스틱이다 — 설치 없이 체크아웃만 열어도 import 가
# 풀려야 한다.
extraPaths = ["src"]
pythonVersion = "3.11"  # requires-python 의 하한과 같다
typeCheckingMode = "basic"

# 전체 strict 는 켜지 않았다: 대부분이 서버 JSON 을 손으로 좁혀 가는 파서 코드라
# 이 단계의 범위가 아니다. 대신 이미 strict 로 오류 0 인 모듈만 strict 에 고정했고,
# 그 목록은 모듈별로 pyright --strict 를 다시 돌려 언제든 재도출할 수 있다.
strict = [
  "src/korail_mobile_api/__init__.py",
  "src/korail_mobile_api/config.py",
  "src/korail_mobile_api/constants.py",
  "src/korail_mobile_api/crypto.py",
  "src/korail_mobile_api/dynapath.py",
  "src/korail_mobile_api/errors.py",
  "src/korail_mobile_api/limousine_models.py",
  "src/korail_mobile_api/limousine_payloads.py",
  "src/korail_mobile_api/netfunnel.py",
  "src/korail_mobile_api/netfunnel_safety.py",
  "src/korail_mobile_api/read_models.py",
]

# scripts 는 가드 검증과 유니온 좁히기 때문에 basic 에서도 걸린다;
# typeCheckingMode="off" 는 executionEnvironments 안에서 이 pyright 버전이
# 무시하므로, 실제로 걸리는 규칙만 골라 규칙별로 끈다.

[[tool.pyright.executionEnvironments]]
root = "scripts"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
reportOptionalMemberAccess = "none"
