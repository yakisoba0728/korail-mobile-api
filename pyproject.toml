[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-mobile-api"
version = "0.2.0"
description = "Python client for documented KORAIL mobile app APIs: read-only by default, with a consent-gated mutation surface"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["korail", "read-only-by-default", "mobile-api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
korail_mobile_api = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# Test the tree pytest was invoked in, not whatever `korail_mobile_api` the
# editable install happens to resolve to. Without this, running pytest from a
# git worktree imports the MAIN checkout's src/ and reports a green suite for
# code that was never under test.
pythonpath = ["src"]
markers = [
  "live: tests that call live KORAIL services and require explicit opt-in",
]
