[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-mobile-api"
version = "0.2.0"
description = "Python client for documented KORAIL mobile app APIs: read-only by default, with a consent-gated mutation surface"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["korail", "read-only-by-default", "mobile-api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
korail_mobile_api = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# Test THIS checkout, not whichever one an editable install happens to point at.
# Without this, `python3 -m pytest` in a git worktree collected the worktree's
# tests but imported korail_mobile_api from the main checkout's src/ (the
# `pip install -e .` finder), so a change could look green while the code under
# test was somebody else's. pytest prepends rootdir-relative pythonpath entries
# to sys.path, which wins over that finder and resolves per checkout.
pythonpath = ["src"]
markers = [
  "live: tests that call live KORAIL services and require explicit opt-in",
]
