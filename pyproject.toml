[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-mobile-api"
dynamic = ["version"]
description = "Unofficial synchronous Python client for the KORAIL mobile API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "yakisoba0728"}]
# The full offline suite passes on Python 3.11 with these exact versions; CI's minimum job installs them.
dependencies = ["httpx>=0.24.1", "cryptography>=42.0.8"]
keywords = ["korail", "ktx", "railway", "train", "reservation", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yakisoba0728/korail-mobile-api"
Documentation = "https://yaki.kr/korail-mobile-api/"
Repository = "https://github.com/yakisoba0728/korail-mobile-api"
Issues = "https://github.com/yakisoba0728/korail-mobile-api/issues"
Changelog = "https://github.com/yakisoba0728/korail-mobile-api/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# SOCKS proxies (KorailConfig.proxy = "socks5://...") need socksio through httpx.
socks = ["httpx[socks]>=0.24.1"]
dev = [
    "actionlint-py>=1.7.12",
    "httpx[socks]>=0.24.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "build>=1.2.2",
    "twine>=6.1",
    "ruff>=0.11",
    "mypy>=1.18.1",
    "pyright>=1.1.400",
    "setuptools>=78.1.1",
    "packaging>=24.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["korail_mobile_api*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "korail_mobile_api.__version__"}

[tool.setuptools.package-data]
korail_mobile_api = ["py.typed", "error_messages.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
markers = ["packaging: build and inspect release archives without network access"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 112
src = ["src"]
extend-exclude = ["analysis", "build", "dist", ".venv", ".venv-min", ".venv-wheel"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I",
    "UP", "B", "SIM", "C4", "RUF", "PERF", "FURB", "PIE", "ANN401", "FBT001", "ERA", "FIX", "D1",
]
# SIM905: whitespace-split code lists stay denser than one literal per line.
# TC001-TC003 stay off: moving imports under TYPE_CHECKING breaks runtime get_type_hints.
ignore = ["D105", "D107", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
# A frozen dataclass instance is a safe shared default.
extend-immutable-calls = ["korail_mobile_api._domains.payments.forms.RefundCompanion"]

[tool.ruff.lint.per-file-ignores]
# tests keep the pre-3.0 rule set (E4/E7/E9/F/I).
"tests/**" = ["UP", "B", "SIM", "C4", "RUF", "PERF", "FURB", "PIE", "ANN401", "FBT001", "ERA", "FIX", "D1"]
# Offline checker scripts are run, not imported; their helpers need no docstrings.
"checks/**" = ["D1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Runtime isinstance guards at the trust boundary are required even when the annotation already says so.
reportUnnecessaryIsInstance = false
# _core/_domains are private packages whose underscore helpers are shared across modules.
reportPrivateUsage = false
reportUnusedFunction = false

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/korail_mobile_api"]
strict = true
disallow_any_explicit = true
enable_error_code = [
    "ignore-without-code",
    "truthy-bool",
    "possibly-undefined",
    "exhaustive-match",
    "mutable-override",
    "deprecated",
    "redundant-self",
]
show_error_codes = true
pretty = true
