name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        dependencies: [current]
        include:
          - python: '3.11'
            dependencies: minimum
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build tools
        id: tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Install exact declared dependency lower bounds
        if: matrix.dependencies == 'minimum'
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from packaging.requirements import Requirement

          with open('pyproject.toml', 'rb') as stream:
              config = tomllib.load(stream)
          requirements = config['project']['dependencies'] + config['build-system']['requires']
          pins = []
          for text in requirements:
              requirement = Requirement(text)
              bounds = list(requirement.specifier)
              assert len(bounds) == 1 and bounds[0].operator == '>='
              pins.append(f'{requirement.name}=={bounds[0].version}')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *pins])
          PY
      - name: Ruff lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python -m ruff check src checks tests
      - name: Ruff format check
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python -m ruff format --check src checks tests
      - name: Mypy strict
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python -m mypy
      - name: Pyright
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && matrix.dependencies == 'current' }}
        run: python -m pyright
      - name: Offline tests, including both original checks
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python -m pytest tests/ --cov=korail_mobile_api --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90 --junitxml=junit.xml
      - name: Save test reports
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.python }}-${{ matrix.dependencies }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14
      - name: Build wheel and sdist
        id: build
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python -m build
      - name: Check distribution metadata and README
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m twine check dist/*
      - name: Install wheel into clean venv and run installed-package checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import tomllib
          import venv
          from packaging.requirements import Requirement

          root = pathlib.Path.cwd()
          target = pathlib.Path(tempfile.mkdtemp(prefix='f8-installed-'))
          venv.EnvBuilder(with_pip=True).create(target / 'venv')
          python = target / 'venv/bin/python'
          clean = target / 'exercise'
          clean.mkdir()
          wheel, = (root / 'dist').glob('*.whl')
          args = [str(python), '-m', 'pip', 'install', str(wheel) + '[socks]', 'pytest>=8.3']
          if '${{ matrix.dependencies }}' == 'minimum':
              config = tomllib.loads((root / 'pyproject.toml').read_text())
              for text in config['project']['dependencies']:
                  requirement = Requirement(text)
                  bound, = requirement.specifier
                  args.append(f'{requirement.name}=={bound.version}')
          subprocess.check_call(args, cwd=clean)
          subprocess.check_call([str(python), '-m', 'pip', 'check'], cwd=clean)
          shutil.copytree(root / 'checks', clean / 'checks')
          # Read the guard literal without importing pytest/conftest in the clean venv.
          import ast
          tree = ast.parse((root / 'tests/conftest.py').read_text())
          node, = [n for n in tree.body if isinstance(n, ast.Assign) and any(
              isinstance(t, ast.Name) and t.id == '_F8_SOCKET_GUARD' for t in n.targets)]
          (clean / 'sitecustomize.py').write_text(ast.literal_eval(node.value))
          env = dict(os.environ, PYTHONPATH=str(clean), PYTHONNOUSERSITE='1', PIP_NO_INDEX='1')
          command = (
              'import importlib.metadata as m, pathlib,sys; import korail_mobile_api as k; '
              'assert pathlib.Path(k.__file__).is_relative_to(sys.prefix); '
              'assert k.__version__ == m.version("korail-mobile-api"); '
              'print(k.__version__, k.__file__)'
          )
          subprocess.check_call([str(python), '-c', command], cwd=clean, env=env)
          for check in ('contract_api.py', 'netfunnel_offline.py'):
              subprocess.check_call([str(python), str(clean / 'checks' / check)], cwd=clean, env=env)
          tests = clean / 'tests'
          tests.mkdir()
          for name in ('conftest.py', 'test_public_api_smoke.py', 'test_7010_contract.py', 'test_dynapath_diagnostic.py', 'test_auth_transport.py', 'test_facade.py', 'test_proxy.py', 'test_refund_binding.py', 'test_convenience_reads.py'):
              shutil.copy2(root / 'tests' / name, tests / name)
          subprocess.check_call([str(python), '-m', 'pytest', '-q', str(tests)], cwd=clean, env=env)
          PY

  maintenance:
    name: Workflow lint and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Lint all workflows, including manual publishing
        run: |
          python -m pip install 'actionlint-py>=1.7.12'
          actionlint -shellcheck= -pyflakes=
      - name: Resolve runtime dependencies for scanning
        run: |
          python -m pip install '.[socks]'
          python -m pip freeze --exclude korail-mobile-api --exclude actionlint-py > requirements.txt
      - name: Scan dependencies, secrets and workflow configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: analysis,build,dist,site,.git,.venv

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements.txt
      - name: Build the documentation site (warnings fail)
        run: python -m mkdocs build --strict
