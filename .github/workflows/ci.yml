name: Offline CI

on:
  push:
  pull_request:

# The whole workflow only ever reads this repository. Nothing here signs an
# artifact, writes a ref, or talks to a package index.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
# Pull-request runs are cancelled outright; a branch run is left to finish so a
# merged commit ends up with a completed result rather than a cancelled one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install lint tooling
        run: python -m pip install -e ".[dev]"
      # `ruff check` only. `ruff format` is deliberately not adopted: this
      # repository's hand-aligned comment tables and evidence blocks are the
      # documentation, and a formatter rewrites them. Which rules are off, and
      # why, is written down in `[tool.ruff]` in pyproject.toml.
      - name: Run ruff
        run: ruff check .

  types:
    name: pyright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The floor `requires-python` states, and the same value
          # `[tool.pyright] pythonVersion` analyses against.
          python-version: '3.11'
      - name: Install type-checking tooling
        run: python -m pip install -e ".[dev]"
      # pyright exits non-zero on any error, so "zero errors" is the gate. Its
      # configuration lives entirely in pyproject.toml, which is also what
      # Pylance reads, so the editor and this job cannot disagree.
      - name: Run pyright
        run: pyright

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, plus one macOS and one Windows
        # run at the newest version. The Windows entry is not symmetry for its
        # own sake: this package's docstrings, comments and fixtures are full
        # of Korean, and Windows is the platform whose default text encoding is
        # not UTF-8. A file opened without an explicit encoding fails there and
        # nowhere else.
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run offline tests
        run: pytest -q -m "not live"

  package:
    name: Verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install build tooling
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/artifacts" .
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py "$RUNNER_TEMP"/artifacts/*.tar.gz "$RUNNER_TEMP"/artifacts/*.whl
      - name: Fresh-venv wheel import outside checkout
        run: |
          venv_dir="$RUNNER_TEMP/release-venv"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install "$RUNNER_TEMP"/artifacts/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$venv_dir/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import korail_mobile_api
          from korail_mobile_api import KorailClient

          package_path = Path(korail_mobile_api.__file__).resolve()
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert "site-packages" in package_path.parts
          assert checkout not in package_path.parents
          print("KorailClient", package_path)
          PY
