name: Publish to PyPI

# Manual only, like docs-deploy.yml. Uploading a version to a package index is a
# decision a person makes, and a version number can never be reused once uploaded.
#
# Upload with Trusted Publishing (no API token is stored). Each index needs a
# "pending publisher" for this repository, this workflow file and the matching
# environment (testpypi / pypi). Run TestPyPI first, then PyPI:
#
#   gh workflow run publish.yml -f index=testpypi
#   gh workflow run publish.yml -f index=pypi
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to upload to
        required: true
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

# One upload at a time; a second run waits instead of racing the first.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/project/korail-mobile-api/' || 'https://test.pypi.org/project/korail-mobile-api/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
