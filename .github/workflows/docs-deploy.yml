name: Docs site

# Manual only. There is no `push:` trigger here, and that is deliberate.
#
# Whether the site BUILDS is already answered on every push by the `mkdocs` job
# in ci.yml, which runs `mkdocs build --strict`. This workflow adds only the
# delivery step, and publishing to a live site is a decision a person makes: a
# push that is correct is not the same as a push that should be public.
#
# Run it from the Actions tab, or with `gh workflow run docs-deploy.yml`.
#
# The original first reason -- that the repository was private and Pages needs a
# paid plan there -- stopped applying when it went public, and the workflow has
# since deployed from a manual dispatch. The reason above is the one that was
# always load-bearing.
on:
  workflow_dispatch:

# Read the checkout; write nothing to it. The Pages deployment needs its own
# two scopes, and they are granted to the deploy job alone.
permissions:
  contents: read

# One live site. A second run started while the first is deploying would race
# it, so the newer run waits rather than being cancelled -- a cancelled deploy
# can leave the site half-updated.
concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install documentation tooling
        run: python -m pip install -e ".[docs]"
      - name: Build the documentation site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
