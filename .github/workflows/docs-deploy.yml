name: Docs site

# Manual only. Whether the site builds is checked on every push by the `docs` job in
# ci.yml (`mkdocs build --strict`). This workflow only publishes, and publishing to
# the live site is a decision a person makes: a push that is correct is not the same
# as a push that should be public.
#
# Run it from the Actions tab, or with `gh workflow run docs-deploy.yml`.
on:
  workflow_dispatch:

# Read the checkout; write nothing to it. The Pages deployment needs its own two
# scopes, and they are granted to the deploy job alone.
permissions:
  contents: read

# One live site. A second run started while the first is deploying waits rather
# than being cancelled; a cancelled deploy can leave the site half-updated.
concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements.txt
      - name: Build the documentation site
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
