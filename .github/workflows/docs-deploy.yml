name: Docs site

# Manual only. There is no `push:` trigger here, and that is deliberate:
#
#   1. This repository is private, and GitHub Pages on a private repository
#      requires a paid plan. A job that ran on every push would fail on every
#      push, for a reason that has nothing to do with the commit.
#   2. Whether the site is built at all is already answered by the `mkdocs` job
#      in ci.yml, which runs `mkdocs build --strict` on every push. This
#      workflow adds only the delivery step, and delivery is a decision a
#      person makes.
#
# When the repository becomes public and Pages is enabled, run this from the
# Actions tab. Nothing else needs to change.
on:
  workflow_dispatch:

# Read the checkout; write nothing to it. The Pages deployment needs its own
# two scopes, and they are granted to the deploy job alone.
permissions:
  contents: read

# One live site. A second run started while the first is deploying would race
# it, so the newer run waits rather than being cancelled -- a cancelled deploy
# can leave the site half-updated.
concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install documentation tooling
        run: python -m pip install -e ".[docs]"
      - name: Build the documentation site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
