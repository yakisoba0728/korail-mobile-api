  <text x="450.0" y="26" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">python — 열차 조회</text>
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'D2Coding', monospace" font-size="15" xml:space="preserve" style="white-space:pre"><text x="28" y="78"><tspan fill="#7ee787">&gt;&gt;&gt; </tspan><tspan fill="#e6edf3">from korail_mobile_api import KorailClient, TrainSearchQuery</tspan></text><text x="28" y="105"><tspan fill="#7ee787">&gt;&gt;&gt; </tspan><tspan fill="#e6edf3">client = KorailClient()</tspan></text><text x="28" y="132"><tspan fill="#7ee787">&gt;&gt;&gt; </tspan><tspan fill="#e6edf3">result = client.search_trains(TrainSearchQuery(</tspan></text><text x="28" y="159"><tspan fill="#7ee787">... </tspan><tspan fill="#e6edf3">    departure_station_code="서울", arrival_station_code="부산",</tspan></text><text x="28" y="186"><tspan fill="#7ee787">... </tspan><tspan fill="#e6edf3">    departure_date="20261002", departure_time="090000", passengers=1))</tspan></text><text x="28" y="213"><tspan fill="#7ee787">&gt;&gt;&gt; </tspan><tspan fill="#e6edf3">for t in result.trains[:4]:</tspan></text><text x="28" y="240"><tspan fill="#7ee787">... </tspan><tspan fill="#e6edf3">    print(t.train_class_name, t.train_no, t.departure_time, t.arrival_time)</tspan></text><text x="28" y="267"><tspan fill="#7ee787">... </tspan><tspan fill="#e6edf3"></tspan></text><text x="28" y="294"><tspan fill="#e6edf3"></tspan><tspan fill="#c9d1d9">KTX 023 090400 113900</tspan></text><text x="28" y="321"><tspan fill="#e6edf3"></tspan><tspan fill="#c9d1d9">KTX-산천 025 093000 120500</tspan></text><text x="28" y="348"><tspan fill="#e6edf3"></tspan><tspan fill="#c9d1d9">KTX 027 100000 123400</tspan></text><text x="28" y="375"><tspan fill="#e6edf3"></tspan><tspan fill="#c9d1d9">KTX-청룡 029 102800 125600</tspan></text></g>
