name: 기능 요청
description: 이 클라이언트에 아직 없는 라우트·읽기·기능.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **자격증명, 토큰, 쿠키, PNR, 승차권 번호, 전화번호, 실명, 운영 서버의 원본 응답을
        이 요청 어디에도 붙여넣으면 안 됩니다.** CONTRIBUTING.md 와 SECURITY.md 를
        참고하십시오.

        상태를 바꾸는 기능을 요청하는 것이라면 CONTRIBUTING.md 의 "동의·안전 모델을 바꾸는
        경우"를 먼저 읽어 주십시오. 기능 설명만으로는 부족하고 안전 설계와 근거가
        필요합니다.
  - type: textarea
    id: what
    attributes:
      label: 무엇이 없나
      description: 어떤 라우트나 기능이며, 그것으로 무엇을 하려고 합니까?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: >-
        그 라우트에 대한 디컴파일된 APK 인용(클래스·파일과 줄 번호)이 있다면 적어 주십시오.
        와이어 이름(라우트 경로, 필드 키)만 짧은 백틱으로 인용하고 디컴파일된 소스는
        붙여넣으면 안 됩니다.
    validations:
      required: false
