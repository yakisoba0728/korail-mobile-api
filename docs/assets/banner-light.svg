<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">korail-mobile-api — an unofficial Python client for Korean rail</title>
  <desc id="description">A Python client with typed responses. An original train illustration crosses a schematic route from request to response.</desc>
  <defs>
    <pattern id="markers" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M14 16h4m-2-2v4" fill="none" stroke="#cbdcd2" stroke-width="1"/>
    </pattern>
    <clipPath id="map-clip"><rect x="784" y="32" width="464" height="336" rx="24"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="24" fill="#f7f9f6" stroke="#dce4de" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Arial, sans-serif">
    <circle cx="65" cy="64" r="5" fill="#087f72"/>
    <text x="82" y="69" fill="#56706f" font-size="14" font-weight="600" letter-spacing="2">UNOFFICIAL / OPEN SOURCE</text>
    <text x="58" y="164" fill="#152d31" font-size="64" font-weight="700" letter-spacing="-2.6">korail<tspan fill="#087f72">-mobile-api</tspan></text>
    <text x="62" y="218" fill="#152d31" font-size="28" letter-spacing="-.5">Korean rail, through Python.</text>
    <text x="63" y="257" fill="#56706f" font-size="20" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">코레일+ 앱 기반 비공식 Python 클라이언트</text>
    <g fill="#56706f" font-size="13" font-weight="600" letter-spacing="1">
      <text x="63" y="327">PYTHON 3.11+</text>
      <text x="223" y="327">TYPED RESPONSES</text>
      <text x="421" y="327">SYNC API</text>
    </g>
    <g fill="#cbdcd2"><circle cx="201" cy="322" r="2"/><circle cx="400" cy="322" r="2"/></g>
